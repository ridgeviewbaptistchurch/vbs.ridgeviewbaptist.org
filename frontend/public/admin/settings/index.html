<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="site-header">
    <img class="site-header__logo" src="/01_IlluminationStation_FullColor.png" alt="Illumination Station VBS">
    <span class="site-header__title">VBS Admin</span>
    <nav class="site-header__nav">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/families/">Families</a>
      <a href="/admin/reports/">Reports</a>
      <a href="/checkin/">Check-In</a>
      <a href="/admin/settings/">Settings</a>
      <span class="site-header__sep"></span>
      <span id="user-name" class="site-header__user"></span>
      <button class="btn btn--secondary btn--sm" id="logout-btn">Log out</button>
    </nav>
  </header>

  <div class="container">
    <h1 class="page-title">Settings</h1>
    <div id="save-msg" class="alert alert--success hidden">Saved.</div>

    <!-- Theme -->
    <div class="card" style="margin-bottom:1.5rem">
      <h2 class="section-title">Theme</h2>
      <form id="theme-form">
        <div class="form-row">
          <div class="form-group">
            <label>Theme Name</label>
            <input type="text" name="theme_name" required>
          </div>
          <div class="form-group">
            <label>Accent Color</label>
            <input type="color" name="accent_color">
          </div>
        </div>
        <div class="form-group">
          <label>Logo</label>
          <input type="file" name="logo" accept="image/*">
          <img id="logo-preview" src="" alt="" style="margin-top:.5rem;max-height:60px;display:none">
        </div>
        <button type="submit" class="btn btn--primary">Save Theme</button>
      </form>
    </div>

    <!-- Sessions -->
    <div class="card" style="margin-bottom:1.5rem">
      <h2 class="section-title">Session Dates</h2>
      <div id="sessions-list"></div>
    </div>

    <!-- Email -->
    <div class="card" style="margin-bottom:1.5rem">
      <h2 class="section-title">Email</h2>
      <p style="font-size:.875rem;color:var(--text-muted);margin:0 0 1rem">Resend the confirmation email to all registered families who provided an email address.</p>
      <button class="btn btn--secondary" id="resend-btn">Resend Confirmation Emails</button>
      <span id="resend-msg" class="hidden" style="margin-left:1rem;font-size:.875rem;color:var(--text-muted)"></span>
    </div>

    <!-- Users -->
    <div class="card">
      <div class="flex justify-between items-center" style="margin-bottom:1rem">
        <h2 class="section-title" style="margin:0">User Accounts</h2>
        <button class="btn btn--secondary btn--sm" id="add-user-btn">+ Add User</button>
      </div>
      <div id="users-list"></div>
    </div>
  </div>

  <!-- Add user modal -->
  <div class="modal-backdrop hidden" id="add-user-modal">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title">Add User</h2>
        <button class="modal__close" id="add-user-close">×</button>
      </div>
      <form id="add-user-form">
        <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <div class="form-group">
          <label>Role</label>
          <select name="role" required>
            <option value="staff_admin">Staff Admin</option>
            <option value="super_admin">Super Admin</option>
            <option value="kiosk">Kiosk</option>
          </select>
        </div>
        <div class="flex gap-2" style="margin-top:1rem">
          <button type="submit" class="btn btn--primary">Add User</button>
          <button type="button" class="btn btn--secondary" id="add-user-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/admin/settings.js"></script>
</body>
</html>
