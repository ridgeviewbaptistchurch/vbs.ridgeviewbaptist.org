<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Families</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="site-header">
    <img class="site-header__logo" src="/01_IlluminationStation_FullColor.png" alt="Illumination Station VBS">
    <span class="site-header__title">VBS Admin</span>
    <nav class="site-header__nav">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/families/">Families</a>
      <a href="/admin/reports/">Reports</a>
      <a href="/checkin/">Check-In</a>
      <a href="/admin/settings/" id="settings-link" class="hidden">Settings</a>
      <span class="site-header__sep"></span>
      <span id="user-name" class="site-header__user"></span>
      <button class="btn btn--secondary btn--sm" id="logout-btn">Log out</button>
    </nav>
  </header>

  <div class="container container--wide">
    <h1 class="page-title">Families</h1>
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="Search name, email, or phone…">
    </div>
    <div class="card" style="padding:0">
      <div class="table-wrap">
        <table id="families-table">
          <thead>
            <tr>
              <th>Parent Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Home Church</th>
              <th>Children</th>
              <th>Registered</th>
              <th class="no-print"></th>
            </tr>
          </thead>
          <tbody id="families-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal-backdrop hidden" id="edit-modal">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title">Edit Family</h2>
        <button class="modal__close" id="modal-close">×</button>
      </div>
      <form id="edit-form">
        <input type="hidden" name="id">
        <div class="form-group"><label>Parent Name</label><input type="text" name="parent_name" required></div>
        <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Home Church</label><input type="text" name="home_church" required></div>
        <div class="flex gap-2" style="margin-top:1rem">
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" class="btn btn--secondary" id="modal-cancel">Cancel</button>
        </div>
      </form>
      <div id="children-section" style="margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1rem">
        <h3 class="section-title" style="font-size:1rem">Children</h3>
        <div id="children-list"></div>
      </div>
    </div>
  </div>

  <!-- Edit child modal -->
  <div class="modal-backdrop hidden" id="edit-child-modal">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title">Edit Child</h2>
        <button class="modal__close" id="child-modal-close">×</button>
      </div>
      <form id="edit-child-form">
        <input type="hidden" name="id">
        <input type="hidden" name="family_id">
        <div class="form-row">
          <div class="form-group"><label>First Name</label><input type="text" name="first_name" required></div>
          <div class="form-group"><label>Last Name</label><input type="text" name="last_name" required></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Grade</label>
            <select name="grade" required>
              <option value="4YO">4 Years Old</option>
              <option value="PK">Pre-K</option>
              <option value="K">Finished Kindergarten</option>
              <option value="1">Finished 1st Grade</option>
              <option value="2">Finished 2nd Grade</option>
              <option value="3">Finished 3rd Grade</option>
              <option value="4">Finished 4th Grade</option>
              <option value="5">Finished 5th Grade</option>
              <option value="6">Finished 6th Grade</option>
              <option value="7">Finished 7th Grade</option>
            </select>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <div style="display:flex;gap:1.5rem;margin-top:.5rem">
              <label style="font-weight:normal;display:flex;align-items:center;gap:.4rem"><input type="radio" name="gender" value="M"> Male</label>
              <label style="font-weight:normal;display:flex;align-items:center;gap:.4rem"><input type="radio" name="gender" value="F"> Female</label>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Allergies</label><input type="text" name="allergies" placeholder="Food, medication, or other allergies…"></div>
          <div class="form-group"><label>Notes</label><input type="text" name="notes" placeholder="Special needs, other info…"></div>
        </div>
        <div class="flex gap-2" style="margin-top:1rem">
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" class="btn btn--secondary" id="child-modal-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/admin/families.js"></script>
</body>
</html>
