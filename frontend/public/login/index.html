<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="width:100%;max-width:380px;padding:1rem">
    <div class="card">
      <h1 class="page-title" style="text-align:center;margin-bottom:1.5rem">Staff Login</h1>
      <div id="error" class="alert alert--error hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%" id="submit-btn">Sign In</button>
      </form>
    </div>
  </div>
  <script type="module">
    import '/js/sentry.js';
    import { api } from '/js/api.js';

    const form = document.getElementById('login-form');
    const errEl = document.getElementById('error');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const data = await api.post('/api/auth/login', {
          email: form.email.value,
          password: form.password.value,
        });
        if (!data) return;
        window.location.href = data.role === 'kiosk' ? '/checkin/' : '/admin/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
