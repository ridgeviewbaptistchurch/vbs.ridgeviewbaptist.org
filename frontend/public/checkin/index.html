<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-In</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .search-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .search-wrap__icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .search-wrap__input {
      width: 100%;
      padding: .875rem 1rem .875rem 3rem;
      font-size: 1.0625rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap__input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
    }
    .session-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .5rem;
      margin-bottom: .625rem;
    }
    .session-row label {
      font-size: .8125rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .session-row select {
      padding: .3rem .625rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .875rem;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
    }
    .session-row select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <img class="site-header__logo" data-theme-logo src="" alt="" style="display:none">
    <span class="site-header__title">VBS Check-In</span>
    <nav class="site-header__nav">
      <span id="user-name" class="text-muted"></span>
      <button class="btn btn--secondary btn--sm" id="logout-btn">Log out</button>
    </nav>
  </header>

  <div class="container">
    <div class="flex gap-2 items-center justify-between" style="margin-bottom:1rem">
      <h1 class="page-title" style="margin:0">Check-In</h1>
      <button class="btn btn--secondary no-print" id="walkin-btn">+ Walk-In</button>
    </div>

    <div id="walkin-section" class="card hidden no-print" style="margin-bottom:1.5rem">
      <h2 class="section-title">Register Walk-In Family</h2>
      <form id="walkin-form">
        <div class="form-row">
          <div class="form-group"><label>Parent Name *</label><input type="text" name="parent_name" required></div>
          <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Email</label><input type="email" name="email"></div>
          <div class="form-group"><label>Home Church *</label><input type="text" name="home_church" required></div>
        </div>
        <div id="walkin-children"></div>
        <button type="button" class="btn btn--secondary btn--sm" id="walkin-add-child" style="margin-bottom:1rem">+ Add Child</button>
        <div class="flex gap-2">
          <button type="submit" class="btn btn--primary">Register & Search</button>
          <button type="button" class="btn btn--secondary" id="walkin-cancel">Cancel</button>
        </div>
      </form>
    </div>

    <div class="session-row">
      <label for="session-select">Night</label>
      <select id="session-select"><option>Loading…</option></select>
    </div>

    <div class="search-wrap">
      <svg class="search-wrap__icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-wrap__input" type="search" id="search-input"
        placeholder="Search by name or phone…" autocomplete="off">
    </div>

    <div id="results"></div>
  </div>

  <script type="module" src="/js/checkin.js"></script>
</body>
</html>
